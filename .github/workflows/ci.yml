name: "ci"

on:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_PKGS_REF: nixos-25.05
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set Up Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo test

  nix:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.NIX_PKGS_REF }}.tar.gz

      - name: Install Cachix Client
        run: nix profile install --inputs-from https://github.com/NixOS/nixpkgs/archive/$NIX_PKGS_REF.tar.gz nixpkgs#cachix

      - name: Use Cachix Cache
        run: cachix use shvl

      - name: Build
        run: nix build -L

      - name: Cachix Push
        run: cachix push $CACHIX_CACHE ./result
